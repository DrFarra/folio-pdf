[package]
name = "folio-pdf"
version = "0.8.11"
description = "Folio: lector PDF local con anotaciones estándar"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "folio_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
folio-core = { path = "../crates/folio-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"

[target.'cfg(any(target_os="windows", target_os="macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-folio-ios = { path = "plugins/folio-ios" }

[features]
custom-protocol = ["tauri/custom-protocol"]
native-qa = []

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-folio-android = { path = "plugins/folio-android" }
