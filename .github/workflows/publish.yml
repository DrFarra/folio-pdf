name: Folio publish

# Publishes the release of a version from the packages its platform workflows already built:
# Actions → Folio publish → Run workflow. Platforms without a successful build of that
# version's commit stay on their previous release (docs/releases.md says which).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión a publicar (por ejemplo 0.9.28)
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect the packages built for this version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Versión inválida: $VERSION"; exit 1; }
          ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || { echo "::error::La release v$VERSION ya existe."; exit 1; }
          # Among the commits at this version (newest first), the one with builds for the most platforms.
          target="" best=0 seen=0
          for sha in $(git rev-list HEAD); do
            if [ "$(git show "$sha:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).version')" != "$VERSION" ]; then
              [ "$seen" = 1 ] && break || continue
            fi
            seen=1 built=0
            for workflow in android.yml ios.yml windows.yml macos.yml; do
              [ -n "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$sha" --status success --limit 1 --json databaseId --jq '.[].databaseId')" ] && built=$((built + 1))
            done
            [ "$built" -gt "$best" ] && { best=$built; target=$sha; }
          done
          [ "$seen" = 1 ] || { echo "::error::Ningún commit tiene la versión $VERSION."; exit 1; }
          [ -n "$target" ] || { echo "::error::Ningún commit de la versión $VERSION tiene paquetes compilados."; exit 1; }
          echo "TARGET=$target" >> "$GITHUB_ENV"
          mkdir -p staging release-assets
          found=0
          for pair in android.yml:Folio-Android ios.yml:Folio-iOS,Folio-iOS-untested windows.yml:Folio-Windows macos.yml:Folio-macos; do
            workflow="${pair%%:*}" names="${pair#*:}"
            for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$target" --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
              for name in ${names//,/ }; do
                # A run lacks the artifact names of other modes; a download cut short is tried again.
                for attempt in 1 2; do
                  rm -rf "staging/$name"
                  if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "staging/$name"; then
                    echo "$workflow: ejecución $run, $name"
                    found=$((found + 1))
                    continue 4
                  fi
                done
              done
            done
            echo "$workflow: sin paquete para ${target:0:7}"
          done
          [ "$found" -gt 0 ] || { echo "::error::No hay paquetes compilados para ${target:0:7} (los de iOS se borran a las 24 h)."; exit 1; }
          # Top-level packages plus MuPDF's source, one copy of each name (as release.yml does).
          find staging -type f ! -name '*-entrega.zip' ! -name 'SHA256SUMS.txt' ! -name 'release-manifest.json' \
            \( -path 'staging/*/sources/*' -o ! -path 'staging/*/*/*' \) -print0 | sort -z |
            while IFS= read -r -d '' file; do [ -e "release-assets/${file##*/}" ] || cp "$file" release-assets/; done
          (cd release-assets && sha256sum -- * > SHA256SUMS.txt)
          git show "$target:docs/releases.md" | awk -v heading="## Cambios en $VERSION" '$0 == heading {on = 1; next} on && /^## / {exit} on' > notes.md
          test -s notes.md || { echo "::error::docs/releases.md no tiene la sección «Cambios en $VERSION»."; exit 1; }
          printf '\nEl estado de firma de cada paquete está en [docs/releases.md](https://github.com/%s/blob/v%s/docs/releases.md). Las sumas SHA-256 están en SHA256SUMS.txt.\n' "$GITHUB_REPOSITORY" "$VERSION" >> notes.md
          ls -l release-assets
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "Folio $VERSION" --notes-file notes.md
