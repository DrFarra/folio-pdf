name: Folio Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android.yml
      - scripts/build-android.mjs
      - scripts/compact-apk.py
      - src-tauri/gen/android/**

permissions:
  contents: read

concurrency:
  group: folio-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies, Android SDK packages and Rust targets
        run: |
          npm ci
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Restore or create the development signing key
        # Without a release keystore the build script signs the test APK with
        # ~/.android/debug.keystore, as Android Studio would. Google Drive's Android
        # client is registered for that key's SHA-1, so CI restores the same key.
        env:
          DEBUG_KEYSTORE: ${{ secrets.FOLIO_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE" ]; then echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore; fi
          test -f ~/.android/debug.keystore || keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
      - name: Build the frontend and the APK
        run: |
          npm run build
          npm run android:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Folio-Android
          path: release/android/
          if-no-files-found: error
