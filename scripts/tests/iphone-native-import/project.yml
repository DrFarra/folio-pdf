name: FolioImportUI
options:
  deploymentTarget:
    iOS: "17.0"
  projectFormat: xcode16_0
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ImportHost:
    type: application
    platform: iOS
    sources:
      - Host.swift
      - path: Fixtures
        buildPhase: resources
    info:
      path: Host-Info.plist
      properties:
        CFBundleDisplayName: Folio Import Host
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.folio.import-ui-host
        PRODUCT_NAME: FolioImportHost
        GENERATE_INFOPLIST_FILE: NO
  ImportUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ImportTests.swift
    dependencies:
      - target: ImportHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.folio.import-ui-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FolioImportUI:
    build:
      targets:
        ImportHost: all
        ImportUITests: [test]
    test:
      targets: [ImportUITests]
      parallelizable: false
      language: en
      region: US
